name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: brew install ffmpeg
      - name: Calibrate synthetic shorts media checks
        run: node scripts/shorts-media.mjs self-test "$RUNNER_TEMP/shorts-media-smoke" smoke
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
